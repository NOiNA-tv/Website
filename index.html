<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOiNA — Portfolio</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header image-slot {
    width: 160px;
  }
  nav a {
    color: #f2f2f2;
    text-decoration: none;
    margin-left: 1.5rem;
    font-size: 0.9rem;
  }
  main {
    padding: 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
  }
  p.tagline {
    color: #999;
    margin-top: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 2rem;
  }
  .card {
    border: 1px solid #222;
    padding: 1rem;
    border-radius: 8px;
  }
  footer {
    padding: 2rem;
    text-align: center;
    color: #666;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <image-slot static-src="assets/noina-logo-static.svg" anim-src="assets/noina-logo.gif" alt="NOiNA logo"></image-slot>
  <nav>
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
  <h1>NOiNA</h1>
  <p class="tagline">Prototype portfolio — placeholder content for testing.</p>

  <section id="work" class="grid">
    <div class="card">
      <h3>Project One</h3>
      <p>Placeholder description.</p>
    </div>
    <div class="card">
      <h3>Project Two</h3>
      <p>Placeholder description.</p>
    </div>
    <div class="card">
      <h3>Project Three</h3>
      <p>Placeholder description.</p>
    </div>
  </section>
</main>

<footer>
  &copy; <span data-year></span> NOiNA
</footer>

<script src="image-slot.js"></script>
<script src="support.js"></script>
</body>
</html>
